[tool.poetry]
name = "whetstone"
version = "0.1.0"
description = "GenAI Testing Toolkit"
authors = ["Kai Greshake <kgreshake@nvidia.com>"]
readme = "README.md"
packages = [{include = "whetstone"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
torch = ">=2.13.0"
hydra-core = ">=1.3.5"
omegaconf = ">=2.3.1"
tqdm = ">=4.70.0"
transformers = ">=5.15.0"
accelerate = ">=1.14.0"
hydra-zen = ">=0.16.0"
rich = ">=15.0.0"
openai = ">=3.0.0"
tiktoken = ">=0.13.0"
protobuf = ">=7.35.1"
sentencepiece = ">=0.2.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1"
bandit = {extras = ["toml", "baseline"], version = ">=1.9.4"}

[build-system]
requires = ["poetry-core>=2.4.0"]
build-backend = "poetry.core.masonry.api"
